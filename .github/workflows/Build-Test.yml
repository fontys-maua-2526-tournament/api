name: Build

on:
  push:
    branches-ignore: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: 21

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Create gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

  test:
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: 21

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Create gradlew executable
        run: chmod +x ./gradlew

      - name: Execute tests
        run: ./gradlew test
